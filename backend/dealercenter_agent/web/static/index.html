<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <title>DealerCenter Agent — Live Run</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto p-6 flex flex-col gap-6 h-full">

    <h1 class="text-xl font-semibold">DealerCenter Agent — Live Run</h1>

    <form id="run-form" class="bg-white rounded-lg shadow p-4 grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">VIN</label>
        <input name="vin" type="text" class="w-full border rounded px-2 py-1.5 text-sm" placeholder="Full VIN">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Stock Number</label>
        <input name="stock_number" type="text" class="w-full border rounded px-2 py-1.5 text-sm" placeholder="Stock #">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Vendor Name</label>
        <input name="vendor_name" type="text" required class="w-full border rounded px-2 py-1.5 text-sm">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Invoice Number</label>
        <input name="invoice_number" type="text" required class="w-full border rounded px-2 py-1.5 text-sm">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Invoice PDF</label>
        <input name="pdf" type="file" accept="application/pdf" required class="w-full text-sm">
      </div>
      <button type="submit"
        class="col-span-2 md:col-span-1 bg-blue-600 hover:bg-blue-700 text-white rounded px-4 py-1.5 text-sm font-medium">
        Run
      </button>
    </form>

    <div class="flex items-center gap-3">
      <button id="open-inspector"
        class="bg-gray-800 hover:bg-gray-900 text-white rounded px-4 py-1.5 text-sm font-medium">
        Open Inspector
      </button>
      <span class="text-xs text-gray-500">
        Live, click-to-interact session with no automated steps. A pipeline Run also becomes
        click-to-interact once it finishes — on whatever page it stopped on, success or failure.
      </span>
    </div>

    <div id="mfa-box" class="hidden bg-amber-50 border border-amber-300 rounded-lg p-4 flex items-center gap-3">
      <span class="text-sm font-medium text-amber-800">MFA code required:</span>
      <input id="mfa-input" type="text" maxlength="6" class="border rounded px-2 py-1 text-sm w-28" placeholder="6-digit code">
      <button id="mfa-submit" class="bg-amber-600 hover:bg-amber-700 text-white rounded px-3 py-1 text-sm">Submit</button>
    </div>

    <div class="grid grid-cols-2 gap-6 flex-1 min-h-0">
      <div class="bg-white rounded-lg shadow flex flex-col min-h-0">
        <div class="px-4 py-2 border-b font-medium text-sm text-gray-700">Workflow Execution</div>
        <div id="log-panel" class="flex-1 overflow-y-auto p-4 space-y-2 font-mono text-xs"></div>
      </div>
      <div class="bg-white rounded-lg shadow flex flex-col min-h-0">
        <div class="px-4 py-2 border-b font-medium text-sm text-gray-700 flex items-center justify-between">
          <span>Browser Output (live)</span>
          <span id="inspector-hint" class="hidden text-xs font-normal text-gray-500">click to interact + inspect</span>
        </div>
        <div class="flex-1 overflow-hidden flex items-center justify-center bg-black">
          <img id="screencast" class="max-w-full max-h-full cursor-crosshair" alt="waiting for browser...">
        </div>
        <div id="type-box" class="hidden border-t p-2 flex gap-2">
          <input id="type-input" type="text" class="flex-1 border rounded px-2 py-1 text-sm"
            placeholder="Type into whatever's focused in the live view, then press Enter">
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('run-form');
    const logPanel = document.getElementById('log-panel');
    const screencast = document.getElementById('screencast');
    const mfaBox = document.getElementById('mfa-box');
    const mfaInput = document.getElementById('mfa-input');
    const mfaSubmit = document.getElementById('mfa-submit');
    const openInspectorBtn = document.getElementById('open-inspector');
    const inspectorHint = document.getElementById('inspector-hint');
    const typeBox = document.getElementById('type-box');
    const typeInput = document.getElementById('type-input');
    let ws = null;

    const STATUS_COLOR = {
      success: 'text-green-700 bg-green-50',
      exists: 'text-blue-700 bg-blue-50',
      failed: 'text-red-700 bg-red-50',
      stopped: 'text-amber-700 bg-amber-50',
    };

    function appendLog(entry) {
      const row = document.createElement('div');
      const color = STATUS_COLOR[entry.status] || 'text-gray-700 bg-gray-50';
      row.className = `rounded px-2 py-1.5 ${color}`;
      const time = new Date(entry.ts * 1000).toLocaleTimeString();
      let detail = '';
      if (entry.data && Object.keys(entry.data).length) {
        detail = ` ${JSON.stringify(entry.data)}`;
      }
      if (entry.reason) {
        detail += ` — ${entry.reason}`;
      }
      row.textContent = `[${time}] ${entry.tool}: ${entry.status}${detail}`;
      logPanel.appendChild(row);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    function appendInspectResult(outerHtml) {
      const row = document.createElement('div');
      row.className = 'rounded px-2 py-1.5 bg-indigo-50 text-indigo-800';
      const time = new Date().toLocaleTimeString();
      const label = document.createElement('div');
      label.textContent = `[${time}] Inspector: clicked element's outerHTML`;
      const pre = document.createElement('pre');
      pre.className = 'whitespace-pre-wrap break-all mt-1 text-[11px]';
      pre.textContent = outerHtml;
      row.appendChild(label);
      row.appendChild(pre);
      logPanel.appendChild(row);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    function wireSocket(run_id) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/${run_id}`);
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'log') {
          appendLog(msg);
        } else if (msg.type === 'frame') {
          screencast.src = `data:image/jpeg;base64,${msg.data}`;
        } else if (msg.type === 'mfa_required') {
          mfaBox.classList.remove('hidden');
          mfaInput.focus();
        } else if (msg.type === 'done') {
          mfaBox.classList.add('hidden');
        } else if (msg.type === 'interactive_ready') {
          inspectorHint.classList.remove('hidden');
          typeBox.classList.remove('hidden');
        } else if (msg.type === 'inspect') {
          appendInspectResult(msg.outer_html);
        } else if (msg.type === 'inspect_error') {
          appendLog({ tool: 'Inspector', status: 'failed', reason: msg.message, ts: Date.now() / 1000 });
        }
      };
    }

    function resetForNewSession() {
      // Close any previous session's socket first — leaving it open was
      // the actual bug: two sessions' frames/logs interleaved into the
      // same panels, which looked like a broken login but was really
      // two concurrent browsers fighting over the same account.
      if (ws) {
        ws.onmessage = null;
        ws.close();
        ws = null;
      }
      logPanel.innerHTML = '';
      mfaBox.classList.add('hidden');
      inspectorHint.classList.add('hidden');
      typeBox.classList.add('hidden');
    }

    async function startSession(url, options) {
      resetForNewSession();
      const resp = await fetch(url, options);
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        appendLog({
          tool: 'Session',
          status: 'failed',
          reason: body.detail || `HTTP ${resp.status}`,
          ts: Date.now() / 1000,
        });
        return;
      }
      const { run_id } = await resp.json();
      wireSocket(run_id);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      startSession('/run', { method: 'POST', body: new FormData(form) });
    });

    openInspectorBtn.addEventListener('click', () => {
      startSession('/inspect/start', { method: 'POST' });
    });

    // Maps a click on the (possibly CSS-scaled) screencast image back to
    // real page coordinates — this only lines up because the Playwright
    // viewport is fixed to the same 1280x800 the screencast is encoded
    // at (see automation/playwright_driver.py). Works any time a session
    // is connected — both a Run and an Inspector session end up in the
    // same interactive loop server-side.
    screencast.addEventListener('click', (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const rect = screencast.getBoundingClientRect();
      const scaleX = (screencast.naturalWidth || 1280) / rect.width;
      const scaleY = (screencast.naturalHeight || 800) / rect.height;
      const x = Math.round((e.clientX - rect.left) * scaleX);
      const y = Math.round((e.clientY - rect.top) * scaleY);
      ws.send(JSON.stringify({ type: 'click', x, y }));
    });

    typeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && ws && typeInput.value) {
        ws.send(JSON.stringify({ type: 'type', text: typeInput.value }));
        typeInput.value = '';
      }
    });

    mfaSubmit.addEventListener('click', () => {
      if (ws && mfaInput.value.trim()) {
        ws.send(JSON.stringify({ type: 'mfa_code', code: mfaInput.value.trim() }));
        mfaBox.classList.add('hidden');
        mfaInput.value = '';
      }
    });
  </script>
</body>
</html>
