<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <title>DealerCenter Agent — Live Run</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto p-6 flex flex-col gap-6 h-full">

    <h1 class="text-xl font-semibold">DealerCenter Agent — Live Run</h1>

    <form id="run-form" class="bg-white rounded-lg shadow p-4 grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">VIN</label>
        <input name="vin" type="text" class="w-full border rounded px-2 py-1.5 text-sm" placeholder="Full VIN">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Stock Number</label>
        <input name="stock_number" type="text" class="w-full border rounded px-2 py-1.5 text-sm" placeholder="Stock #">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Vendor Name</label>
        <input name="vendor_name" type="text" required class="w-full border rounded px-2 py-1.5 text-sm">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Invoice Number</label>
        <input name="invoice_number" type="text" required class="w-full border rounded px-2 py-1.5 text-sm">
      </div>
      <div class="col-span-2 md:col-span-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Invoice PDF</label>
        <input name="pdf" type="file" accept="application/pdf" required class="w-full text-sm">
      </div>
      <button type="submit"
        class="col-span-2 md:col-span-1 bg-blue-600 hover:bg-blue-700 text-white rounded px-4 py-1.5 text-sm font-medium">
        Run
      </button>
    </form>

    <div id="mfa-box" class="hidden bg-amber-50 border border-amber-300 rounded-lg p-4 flex items-center gap-3">
      <span class="text-sm font-medium text-amber-800">MFA code required:</span>
      <input id="mfa-input" type="text" maxlength="6" class="border rounded px-2 py-1 text-sm w-28" placeholder="6-digit code">
      <button id="mfa-submit" class="bg-amber-600 hover:bg-amber-700 text-white rounded px-3 py-1 text-sm">Submit</button>
    </div>

    <div class="grid grid-cols-2 gap-6 flex-1 min-h-0">
      <div class="bg-white rounded-lg shadow flex flex-col min-h-0">
        <div class="px-4 py-2 border-b font-medium text-sm text-gray-700">Workflow Execution</div>
        <div id="log-panel" class="flex-1 overflow-y-auto p-4 space-y-2 font-mono text-xs"></div>
      </div>
      <div class="bg-white rounded-lg shadow flex flex-col min-h-0">
        <div class="px-4 py-2 border-b font-medium text-sm text-gray-700">Browser Output (live)</div>
        <div class="flex-1 overflow-hidden flex items-center justify-center bg-black">
          <img id="screencast" class="max-w-full max-h-full" alt="waiting for browser...">
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('run-form');
    const logPanel = document.getElementById('log-panel');
    const screencast = document.getElementById('screencast');
    const mfaBox = document.getElementById('mfa-box');
    const mfaInput = document.getElementById('mfa-input');
    const mfaSubmit = document.getElementById('mfa-submit');
    let ws = null;

    const STATUS_COLOR = {
      success: 'text-green-700 bg-green-50',
      exists: 'text-blue-700 bg-blue-50',
      failed: 'text-red-700 bg-red-50',
      stopped: 'text-amber-700 bg-amber-50',
    };

    function appendLog(entry) {
      const row = document.createElement('div');
      const color = STATUS_COLOR[entry.status] || 'text-gray-700 bg-gray-50';
      row.className = `rounded px-2 py-1.5 ${color}`;
      const time = new Date(entry.ts * 1000).toLocaleTimeString();
      let detail = '';
      if (entry.data && Object.keys(entry.data).length) {
        detail = ` ${JSON.stringify(entry.data)}`;
      }
      if (entry.reason) {
        detail += ` — ${entry.reason}`;
      }
      row.textContent = `[${time}] ${entry.tool}: ${entry.status}${detail}`;
      logPanel.appendChild(row);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      logPanel.innerHTML = '';
      mfaBox.classList.add('hidden');

      const resp = await fetch('/run', { method: 'POST', body: new FormData(form) });
      const { run_id } = await resp.json();

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/${run_id}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'log') {
          appendLog(msg);
        } else if (msg.type === 'frame') {
          screencast.src = `data:image/jpeg;base64,${msg.data}`;
        } else if (msg.type === 'mfa_required') {
          mfaBox.classList.remove('hidden');
          mfaInput.focus();
        } else if (msg.type === 'done') {
          mfaBox.classList.add('hidden');
        }
      };
    });

    mfaSubmit.addEventListener('click', () => {
      if (ws && mfaInput.value.trim()) {
        ws.send(JSON.stringify({ type: 'mfa_code', code: mfaInput.value.trim() }));
        mfaBox.classList.add('hidden');
        mfaInput.value = '';
      }
    });
  </script>
</body>
</html>
