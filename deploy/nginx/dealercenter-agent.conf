# Reverse proxy for the DealerCenter Agent web app. Terminates TLS
# (via certbot's managed server block, appended by
# certbot --nginx) and proxies everything to uvicorn on 127.0.0.1:8000.
#
# The /ws/ location's Upgrade/Connection headers are required — the
# Live Run page's CDP screencast and MFA flow run over a WebSocket
# (see web/app.py's /ws/{run_id}); without these headers nginx proxies
# it as a plain HTTP request and the socket silently fails to connect.
#
# Install: copy to /etc/nginx/sites-available/dealercenter-agent,
# symlink into sites-enabled, then run:
#   certbot --nginx -d your-domain.example.com
# which rewrites this file in place to add the TLS server block.
#
# Also bump `worker_connections` in /etc/nginx/nginx.conf's `events {}`
# block (that directive only exists once, globally — it can't be set
# per-site here) if expecting sustained high webhook concurrency:
#   events { worker_connections 2048; }
# nginx's default (768-1024) is tight for 500-1000 concurrent
# connections; the app's own threadpool/RQ workers are the real
# bottleneck at that volume, not nginx, but this avoids nginx itself
# capping out first.

server {
    listen 80;
    server_name your-domain.example.com;

    # Webhook deliveries can embed a base64 PDF (content_base64) —
    # nginx's 1MB default rejects those with a 413 before they ever
    # reach the app. Raised with headroom for a reasonably large PDF
    # plus its base64 overhead.
    client_max_body_size 25m;

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # live run sessions can sit idle for a while
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Headroom under a webhook burst (500-1k+ deliveries) — each
        # handler itself is fast (DB insert + queue enqueue, no
        # blocking download), but this avoids nginx timing out a
        # request that's just waiting its turn in FastAPI's threadpool.
        proxy_read_timeout 120s;
    }
}
